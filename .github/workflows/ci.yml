name: CI

# The core's own gates. Every job runs on the runner named by the repository
# variable CORE_CI_RUNNER (a JSON list of labels) when it is set, and on the
# GitHub-hosted ubuntu-latest runner when it is unset or empty; no job falls
# back to a self-hosted runner. Python is the runner's own python3: nothing is
# downloaded to provide it. No step is skipped or allowed to fail: a gate that
# cannot run fails its job. Every python3 that runs a gate script, and every
# step whose shell is python3, runs isolated (python3 -I): the script's own
# folder and the working folder are off the import path and no PYTHON*
# variable or user site applies, so a module a pull request adds beside a
# script cannot shadow a standard-library import.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Every vendored test and every repository-only test, run stand-alone in
  # this checkout, which holds only the vendored files and this repository's
  # own: a test that reaches a file outside that set fails here. HOME is a
  # fresh folder, so no test reads the runner's own home folder. The rails
  # plugin's guard suites run in a step of their own, under python3 -I.
  pytest:
    name: pytest (vendored and repository-only tests, stand-alone)
    runs-on: ${{ fromJSON(vars.CORE_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use the runner's python3, or install pytest into a job venv when it lacks pytest
        shell: python3 -I {0}
        run: |
          import os, subprocess, sys
          found = subprocess.run(["python3", "-c", "import pytest"], capture_output=True)
          if found.returncode == 0:
              python = "python3"
              print("pytest is importable in the runner's python3")
          else:
              venv = os.path.join(os.environ["RUNNER_TEMP"], "core-pytest-venv")
              subprocess.run(["python3", "-m", "venv", venv], check=True)
              python = os.path.join(venv, "bin", "python")
              subprocess.run([python, "-m", "pip", "install", "pytest==9.1.1"], check=True)
              print(f"pytest installed into the job venv {venv}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"CORE_PYTHON={python}\n")
      - name: Run every test suite
        shell: python3 -I {0}
        run: |
          import os, subprocess, sys, tempfile
          home = tempfile.mkdtemp(dir=os.environ["RUNNER_TEMP"])
          env = dict(os.environ, HOME=home, PYTHONDONTWRITEBYTECODE="1")
          suites = ["skills/_lib/tests", "skills/_lib/recall/tests",
                    "skills/_lib/ledger/tests", "scripts/tests"]
          command = [os.environ["CORE_PYTHON"], "-m", "pytest", "-q", "-ra",
                     "-p", "no:cacheprovider", *suites]
          sys.exit(subprocess.run(command, env=env).returncode)
      - name: Run the rails plugin's guard suites under python3 -I, in a fresh home
        shell: python3 -I {0}
        run: |
          import os, subprocess, sys, tempfile
          # Preflight: every program the destructive-command guard runs, where
          # the guard itself looks for it, and pytest under -I. jq, wc, tr, git
          # and grep must be in one of the guard's trusted roots (PATH is not
          # what the guard reads); the rest are absolute paths. Nothing is
          # installed or skipped: a missing one fails this step by name.
          roots = ["/usr/bin", "/bin", "/usr/local/bin", "/opt/homebrew/bin", "/home" + "/linuxbrew/.linuxbrew/bin"]
          def runnable(path):
              return os.access(path, os.X_OK) and not os.path.isdir(path)
          missing = [f"{tool} in a trusted root" for tool in ("jq", "wc", "tr", "git", "grep")
                     if not any(runnable(os.path.join(root, tool)) for root in roots)]
          missing += [path for path in ("/usr/bin/perl", "/usr/bin/git", "/usr/bin/env", "/usr/bin/find",
                                        "/usr/bin/readlink", "/bin/cat", "/usr/bin/id", "/bin/date", "/bin/bash")
                      if not runnable(path)]
          if not (runnable("/usr/bin/stat") or runnable("/bin/stat")):
              missing.append("/usr/bin/stat or /bin/stat")
          if subprocess.run([os.environ["CORE_PYTHON"], "-I", "-c", "import pytest"]).returncode != 0:
              missing.append("pytest under python3 -I")
          if missing:
              print("rails preflight: missing " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)
          home = tempfile.mkdtemp(dir=os.environ["RUNNER_TEMP"])
          env = dict(os.environ, HOME=home, PYTHONDONTWRITEBYTECODE="1")
          command = [os.environ["CORE_PYTHON"], "-I", "-m", "pytest", "-q", "-ra",
                     "-p", "no:cacheprovider", "plugins/rails/tests"]
          sys.exit(subprocess.run(command, env=env).returncode)

  # .core-manifest lists exactly the vendored files, each tracked at mode
  # 100644, and every other tracked file is in VENDORING.md's
  # repository-only table.
  core-manifest:
    name: core manifest
    runs-on: ${{ fromJSON(vars.CORE_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: .core-manifest and the repository-only table cover every tracked file
        run: python3 -I scripts/check-core-manifest.py

  # No tracked file names a person, a machine, a home path or a private host.
  # The person and owner words come only from the repository secret
  # NO_PERSON_DENY, which the log masks (a repository variable would be
  # printed in the step's env block); no step echoes it. The check fails
  # here when it is unset or empty, and never prints a matched word or the
  # list.
  no-person:
    name: no person
    runs-on: ${{ fromJSON(vars.CORE_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: No tracked file names a person, a machine, a home path or a private host
        env:
          NO_PERSON_DENY: ${{ secrets.NO_PERSON_DENY }}
        run: python3 -I scripts/check-no-person.py

  # The vendored ledger. skills/_lib/ledger is the public ledger repository's
  # ledger/ tree at the commit ledger-vendor.pin names, byte for byte.
  #   * offline: the files of this checkout against the pin's manifest of git
  #     blob ids (an edited, removed, added, re-moded or symlinked file);
  #   * --source: the manifest against the ledger repository at the pinned
  #     commit, which must be the pinned tag and be on the ledger's main.
  ledger-drift:
    name: ledger drift
    runs-on: ${{ fromJSON(vars.CORE_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: skills/_lib/ledger matches ledger-vendor.pin (offline)
        run: python3 -I scripts/check-ledger-vendor.py
      # The ledger repository is public and belongs to this repository's
      # owner; its URL is built from github.repository_owner, never typed.
      # This step fetches exactly three things, read-only over HTTPS with no
      # token, no credential helper and none of the runner's git
      # configuration, into a fresh folder under RUNNER_TEMP: the ledger's
      # main (into refs/remotes/origin/main), the pinned tag and the pinned
      # commit. A pin whose repo line names any other repository fails the
      # step rather than redirect the fetch; a failed fetch fails the step.
      - name: ledger-vendor.pin matches the ledger repository at the pinned commit (--source)
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
          OWNER: ${{ github.repository_owner }}
        shell: python3 -I {0}
        run: |
          import os, re, subprocess, sys, tempfile
          owner = os.environ["OWNER"]
          expected = f"{owner}/ledger"
          url = f"https://github.com/{expected}.git"
          values = {"repo": [], "sha": [], "tag": []}
          with open("ledger-vendor.pin", encoding="utf-8") as handle:
              for line in handle:
                  fields = line.split()
                  if len(fields) >= 2 and fields[0] in values:
                      values[fields[0]].append(fields[1])
          def refuse(message):
              print(message, file=sys.stderr)
              sys.exit(1)
          if values["repo"] != [expected]:
              refuse(f"ledger-vendor.pin names repo {values['repo']}; this step fetches only {expected}")
          if len(values["sha"]) != 1 or not re.fullmatch(r"[0-9a-f]{40}", values["sha"][0]):
              refuse("ledger-vendor.pin has no single 40-hex sha line")
          if len(values["tag"]) != 1 or not re.fullmatch(r"[A-Za-z0-9._-]+", values["tag"][0]):
              refuse("ledger-vendor.pin has no single well-formed tag line")
          sha, tag = values["sha"][0], values["tag"][0]
          source = tempfile.mkdtemp(prefix="ledger-at-pin.", dir=os.environ["RUNNER_TEMP"])
          def git(*args):
              done = subprocess.run(["git", *args])
              if done.returncode != 0:
                  refuse(f"git {args[0]} failed with exit {done.returncode}")
          git("init", "-q", source)
          git("-C", source, "fetch", "--no-tags", url, "refs/heads/main:refs/remotes/origin/main")
          git("-C", source, "fetch", "--no-tags", url, f"refs/tags/{tag}:refs/tags/{tag}")
          git("-C", source, "fetch", "--no-tags", url, sha)
          check = subprocess.run(["python3", "-I", "scripts/check-ledger-vendor.py", "--source", source])
          sys.exit(check.returncode)

  # The marketplace manifest and the harness plugin validate under Claude Code's
  # own validator, strict (a warning fails the job), in a fresh HOME so no
  # account, setting or plugin of the runner is read. Claude Code comes from npm
  # at one exact version, into a folder of this job; moving that version is a
  # change to this file. The runner's own node (22 or newer, which that version
  # needs) is used and checked. Nothing here signs in or fetches a plugin.
  #
  # The --source step is the job's one network step. It asks the GitHub REST
  # API, at the fixed host api.github.com (no variable moves it), with no token
  # and no Authorization header, which commit each external plugin's release
  # tag names now: the singular git/ref/tags endpoint, then at most four tag
  # objects, no redirect followed, one request per url. A tag that does not
  # name exactly the pinned commit fails the step, and so does any error; a
  # GitHub rate limit fails it as "rate limited; rerun" (rerun later).
  # The owner anchor is github.repository_owner, passed as --expect-owner from
  # the step's env: the owner in ledger-vendor.pin must equal it, and in CI a
  # missing or empty anchor is refused. A local run without --expect-owner
  # has no anchor and prints a line saying so. In CI the step also refuses
  # before any request when a proxy or CA-override variable (https_proxy,
  # all_proxy, ssl_cert_file or ssl_cert_dir, in any letter case) is set, and
  # names it. python3 -I keeps a module beside the script from shadowing an
  # import. The step attests only for an unmodified workflow and script
  # (KNOWN-LIMITS.md).
  plugin-validate:
    name: plugin validate (marketplace and harness plugin, strict)
    runs-on: ${{ fromJSON(vars.CORE_CI_RUNNER || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The external pins are the commits their tags name (--source)
        env:
          EXPECT_OWNER: ${{ github.repository_owner }}
        run: python3 -I scripts/check-marketplace.py --source --expect-owner "$EXPECT_OWNER"
      - name: The runner's node is 22 or newer
        run: |
          node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)'
      - name: Install Claude Code at the pinned version into a folder of this job
        run: |
          npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund "@anthropic-ai/claude-code@2.1.325"
      - name: Validate the marketplace and the harness plugin, strict, in a fresh home
        run: |
          set -euo pipefail
          home="$(mktemp -d "$RUNNER_TEMP/validate-home.XXXXXX")"
          claude="$RUNNER_TEMP/claude-code/node_modules/.bin/claude"
          HOME="$home" "$claude" --version
          HOME="$home" "$claude" plugin validate --strict .
          HOME="$home" "$claude" plugin validate --strict plugins/harness
